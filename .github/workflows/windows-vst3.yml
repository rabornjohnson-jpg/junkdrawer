name: Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || { echo "::error::$(tail -c 1500 cfg.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Build
        run: cmake --build build --target JunkDrawer_VST3
      - name: Collect the VST3
        shell: bash
        run: |
          mkdir out
          cp -r "$(find build -type d -name 'Rotary Dial.vst3' | head -1)" out/
      - uses: actions/upload-artifact@v4
        with:
          name: JunkDrawer-VST3-Windows
          path: out
